<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>PrecisionFix</title>
<style>
  :root {
    --bg: #08080a;
    --side: #0d0d10;
    --line: #1b1b20;
    --card: #101014;
    --text: #f1f1f4;
    --muted: #7b7b85;
    --green: #22c55e;
    --green-dk: #15803d;
    --off: #25252b;
    --warn: #f5b942;
    --font: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    overflow: hidden;
    user-select: none;
  }

  /* ---------- sidebar ---------- */
  aside {
    width: 230px;
    background: var(--side);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 26px 0 22px;
    flex-shrink: 0;
  }
  .brand { padding: 0 24px; }
  .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: .2px; }
  .brand small { color: var(--muted); font-size: 11px; }
  .overall { padding: 18px 24px 22px; }
  .overall .row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 7px; }
  .overall .row b { color: var(--text); font-weight: 600; }
  .track { height: 5px; background: var(--off); border-radius: 3px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--green); transition: width .25s ease; }

  nav { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; }
  nav button {
    background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px;
    text-align: left; padding: 11px 12px; border-radius: 8px; cursor: pointer;
  }
  nav button:hover { color: var(--text); }
  nav button[aria-current="page"] { background: #17171c; color: var(--text); box-shadow: inset 2px 0 0 var(--green); }
  nav button:focus-visible, .check:focus-visible, .btn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  .side-foot { margin-top: auto; padding: 0 24px; font-size: 11px; color: var(--muted); line-height: 1.5; }

  /* ---------- main ---------- */
  main { flex: 1; display: flex; flex-direction: column; padding: 30px 36px 22px; min-width: 0; }
  header h2 { font-size: 26px; font-weight: 700; }
  header p { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .notice {
    margin-top: 16px; padding: 10px 14px; border-radius: 8px; font-size: 12.5px;
    background: #1d1708; border: 1px solid #4a3a12; color: var(--warn);
  }

  .list {
    margin-top: 22px; flex: 1; overflow-y: auto;
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start;
  }
  .item {
    display: flex; gap: 14px; align-items: flex-start; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; color: inherit; font: inherit; cursor: pointer; width: 100%;
  }
  .item:hover { border-color: #2a2a31; }
  .check {
    width: 22px; height: 22px; border-radius: 6px; background: var(--off);
    display: grid; place-items: center; flex-shrink: 0; margin-top: 1px;
    color: #04130a; font-size: 14px; font-weight: 800; transition: background .12s;
  }
  .item[aria-checked="true"] .check { background: var(--green); }
  .item .t { font-size: 14px; font-weight: 600; }
  .item .d { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }

  /* ---------- rodapé ---------- */
  footer { padding-top: 16px; }
  .status { font-size: 12px; color: var(--muted); height: 18px; margin-bottom: 10px; }
  .status.err { color: #ef6b6b; }
  .actions { display: flex; gap: 10px; }
  .btn {
    border: 0; font: inherit; font-size: 13px; font-weight: 600; color: #fff;
    padding: 11px 20px; border-radius: 8px; cursor: pointer;
  }
  .btn.primary { background: var(--green-dk); }
  .btn.primary:hover { background: #1a9a4a; }
  .btn.ghost { background: #2a2a31; }
  .btn.ghost:hover { background: #34343c; }
  .btn:disabled { opacity: .4; cursor: default; }

  .list::-webkit-scrollbar { width: 8px; }
  .list::-webkit-scrollbar-thumb { background: #26262c; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <aside>
    <div class="brand">
      <h1>PrecisionFix</h1>
      <small>v1.0</small>
    </div>
    <div class="overall">
      <div class="row"><span>Progresso da otimização</span><b id="pct">0%</b></div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <nav id="nav" aria-label="Seções"></nav>
    <div class="side-foot">Os valores originais são guardados antes de qualquer mudança.</div>
  </aside>

  <main>
    <header>
      <h2 id="title"></h2>
      <p id="sub"></p>
    </header>
    <div id="notice" class="notice" hidden>FiveM não encontrado neste PC. Os ajustes desta página que dependem dele serão ignorados.</div>
    <section class="list" id="list" aria-label="Ajustes"></section>
    <footer>
      <div class="status" id="status" role="status">Pronto.</div>
      <div class="actions">
        <button class="btn primary" id="apply">Aplicar selecionados</button>
        <button class="btn ghost" id="restore">Restaurar padrão</button>
      </div>
    </footer>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  let data, page, selected = new Set();

  function setProgress(f) {
    const p = Math.round(f * 100);
    $('fill').style.width = p + '%';
    $('pct').textContent = p + '%';
  }

  function status(msg, err = false) {
    const el = $('status');
    el.textContent = msg;
    el.classList.toggle('err', err);
  }

  function renderNav() {
    const nav = $('nav');
    nav.replaceChildren();
    for (const p of data.pages) {
      const b = document.createElement('button');
      b.textContent = p;
      if (p === page) b.setAttribute('aria-current', 'page');
      b.onclick = () => { page = p; render(); };
      nav.append(b);
    }
  }

  function render() {
    renderNav();
    $('title').textContent = page;
    $('sub').textContent = data.subtitles[page];
    $('notice').hidden = !(page === 'FiveM' && !data.fivemFound);
    $('restore').disabled = !data.hasBackup;

    const list = $('list');
    list.replaceChildren();
    for (const t of data.tweaks.filter((x) => x.page === page)) {
      const item = document.createElement('button');
      item.className = 'item';
      item.setAttribute('role', 'checkbox');
      item.setAttribute('aria-checked', selected.has(t.id));

      const box = document.createElement('span');
      box.className = 'check';
      box.textContent = selected.has(t.id) ? '✔' : '';

      const text = document.createElement('span');
      const name = document.createElement('div'); name.className = 't'; name.textContent = t.name;
      const desc = document.createElement('div'); desc.className = 'd'; desc.textContent = t.desc;
      text.append(name, desc);

      item.append(box, text);
      item.onclick = () => {
        selected.has(t.id) ? selected.delete(t.id) : selected.add(t.id);
        item.setAttribute('aria-checked', selected.has(t.id));
        box.textContent = selected.has(t.id) ? '✔' : '';
      };
      list.append(item);
    }
  }

  async function reload() {
    data = await window.api.info();
    render();
  }

  $('apply').onclick = async () => {
    if (!selected.size) return status('Selecione pelo menos um ajuste.', true);
    $('apply').disabled = $('restore').disabled = true;
    setProgress(0);
    status('Aplicando ajustes...');
    const res = await window.api.apply([...selected]);
    $('apply').disabled = false;
    if (res.fatal) {
      status(res.fatal, true);
    } else if (res.errors.length) {
      status(`${res.applied} aplicado(s). ${res.errors.length} falhou: ${res.errors[0]}`, true);
    } else {
      status(`${res.applied} ajuste(s) aplicado(s). Se algo não mudou, reinicie o PC.`);
    }
    await reload();
  };

  $('restore').onclick = async () => {
    $('apply').disabled = $('restore').disabled = true;
    status('Restaurando valores originais...');
    const res = await window.api.restore();
    $('apply').disabled = false;
    setProgress(0);
    res.ok ? status('Valores originais restaurados.') : status(res.error, true);
    await reload();
  };

  window.api.onProgress(setProgress);

  (async () => {
    data = await window.api.info();
    page = data.pages[0];
    selected = new Set(data.tweaks.filter((t) => t.default).map((t) => t.id));
    render();
  })();
</script>
</body>
</html>
